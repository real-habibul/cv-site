server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Cloudflare menangani TLS; jangan bocorkan info versi nginx.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/pdf;
    gzip_min_length 512;

    # HTML: selalu revalidasi supaya perubahan langsung terlihat.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # PDF: cache pendek, karena isi CV sering diperbarui.
    location = /assets/cv-ahmad-habibul-ulum.pdf {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Content-Disposition 'inline; filename="CV Ahmad Habibul Ulum.pdf"' always;
    }

    # Aset statis berversi: boleh di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
